name: Build Generals iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen python3

      - name: Install vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          fi

          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Initialize DXVK submodule
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk

      - name: Build MoltenVK for iOS
        run: |
          cd "$RUNNER_TEMP"

          git clone --depth 1 \
            https://github.com/KhronosGroup/MoltenVK.git \
            MoltenVK

          cd MoltenVK

          ./fetchDependencies --ios

          make ios

          echo "=== Searching for libMoltenVK.a ==="
          find . -name "libMoltenVK.a" -print

      - name: Prepare Vulkan SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK"
          mkdir -p "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64"

          MOLTENVK_LIB=$(find "$RUNNER_TEMP/MoltenVK" \
            -name "libMoltenVK.a" \
            -path "*ios*" \
            | head -n 1)

          if [ -z "$MOLTENVK_LIB" ]; then
            echo "ERROR: libMoltenVK.a not found"
            find "$RUNNER_TEMP/MoltenVK" -iname "*MoltenVK*" -print
            exit 1
          fi

          echo "Found MoltenVK:"
          echo "$MOLTENVK_LIB"

          cp "$MOLTENVK_LIB" \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Prepared Vulkan SDK:"
          find "$SDK_ROOT" -type f -print

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"

          test -f \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          ls -lah \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/"

      - name: Fetch runtime MoltenVK
        run: |
          chmod +x ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: |
          chmod +x ./scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS build
        run: |
          echo "Using VULKAN_SDK=$VULKAN_SDK"
          cmake --preset ios-vulkan

      - name: Build Generals Zero Hour
        run: |
          cmake --build build/ios-vulkan \
            --target z_generals \
            --parallel 3

      - name: Find generated application
        if: always()
        run: |
          echo "=== iOS app bundles ==="
          find build -name "*.app" -print || true

          echo "=== GeneralsXZH binaries ==="
          find build -name "GeneralsXZH" -
