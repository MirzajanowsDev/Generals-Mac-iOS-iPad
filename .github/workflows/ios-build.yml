name: Build iPhone Generals

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            meson \
            pkgconf \
            xcodegen \
            python3 \
            glslang \
            spirv-tools

          BREW_PREFIX="$(brew --prefix)"
          GLSLANG_PREFIX="$(brew --prefix glslang)"

          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$GLSLANG_PREFIX/bin" >> "$GITHUB_PATH"

          echo "=== Installed tools ==="
          cmake --version
          ninja --version
          meson --version

          echo "=== glslang ==="
          test -x "$GLSLANG_PREFIX/bin/glslangValidator"
          "$GLSLANG_PREFIX/bin/glslangValidator" --version

      - name: Configure shader tools PATH
        run: |
          GLSLANG_PREFIX="$(brew --prefix glslang)"
          BREW_PREFIX="$(brew --prefix)"

          echo "$GLSLANG_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"

          echo "GLSLANG_BIN=$GLSLANG_PREFIX/bin" >> "$GITHUB_ENV"

      - name: Verify glslang
        run: |
          export PATH="$GLSLANG_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"

          which glslangValidator
          glslangValidator --version

          which spirv-as || true
          which spirv-dis || true

      - name: Install vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          fi

          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Initialize DXVK submodule
        run: |
          git submodule update \
            --init \
            --recursive \
            references/fbraz3-dxvk

      - name: Build MoltenVK for iOS
        run: |
          cd "$RUNNER_TEMP"

          rm -rf MoltenVK

          git clone \
            --depth 1 \
            https://github.com/KhronosGroup/MoltenVK.git \
            MoltenVK

          cd MoltenVK

          ./fetchDependencies --ios

          make ios

          echo "=== MoltenVK libraries ==="
          find . -name "libMoltenVK.a" -print

      - name: Prepare Vulkan SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK"

          rm -rf "$SDK_ROOT"

          mkdir -p \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64"

          MOLTENVK_LIB="$(find "$RUNNER_TEMP/MoltenVK" \
            -type f \
            -name "libMoltenVK.a" \
            -path "*ios*" \
            | head -n 1)"

          if [ -z "$MOLTENVK_LIB" ]; then
            echo "ERROR: libMoltenVK.a not found"
            exit 1
          fi

          echo "Found MoltenVK:"
          echo "$MOLTENVK_LIB"

          cp "$MOLTENVK_LIB" \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"

          test -f \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          ls -lah \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/"

      - name: Fetch runtime MoltenVK
        run: |
          chmod +x ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: |
          chmod +x ./scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS build
        run: |
          export PATH="$GLSLANG_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "VULKAN_SDK=$VULKAN_SDK"
          echo "VCPKG_ROOT=$VCPKG_ROOT"

          which glslangValidator
          glslangValidator --version

          rm -rf build/ios-vulkan

          cmake --preset ios-vulkan

      - name: Build Generals Zero Hour
        run: |
          export PATH="$GLSLANG_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"

          which glslangValidator

          cmake --build build/ios-vulkan \
            --target z_generals \
            --parallel 3

      - name: Generate Xcode iOS wrapper
        run: |
          cd ios

          xcodegen generate

          xcodebuild \
            -project GeneralsXZH.xcodeproj \
            -scheme GeneralsXZH \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios/build" \
            PRODUCT_BUNDLE_IDENTIFIER="com.mirzajanows.generalsxzh" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Assemble final iPhone app
        run: |
          set -e

          ENGINE_APP="$GITHUB_WORKSPACE/build/ios-vulkan/GeneralsMD/GeneralsXZH.app"
          ENGINE="$ENGINE_APP/GeneralsXZH"

          SHELL_APP="$GITHUB_WORKSPACE/ios/build/Build/Products/Release-iphoneos/GeneralsXZH.app"

          FINAL_DIR="$GITHUB_WORKSPACE/build/ios-package"
          FINAL_APP="$FINAL_DIR/GeneralsXZH.app"

          DXVK="$GITHUB_WORKSPACE/build/ios-vulkan/_deps/dxvk-build-macos"
          BUILD="$GITHUB_WORKSPACE/build/ios-vulkan"

          echo "=== Checking required files ==="

          test -f "$ENGINE"
          test -d "$SHELL_APP"

          rm -rf "$FINAL_DIR"
          mkdir -p "$FINAL_DIR"

          cp -R "$SHELL_APP" "$FINAL_APP"

          echo "=== Installing real Generals executable ==="

          rm -f "$FINAL_APP/GeneralsXZH"
          cp "$ENGINE" "$FINAL_APP/GeneralsXZH"
          chmod +x "$FINAL_APP/GeneralsXZH"

          mkdir -p "$FINAL_APP/Frameworks"

          echo "=== Adding DXVK ==="

          cp \
            "$DXVK/src/d3d8/libdxvk_d3d8.0.dylib" \
            "$FINAL_APP/Frameworks/"

          cp \
            "$DXVK/src/d3d9/libdxvk_d3d9.0.dylib" \
            "$FINAL_APP/Frameworks/"

          echo "=== Adding SDL ==="

          cp \
            "$BUILD/_deps/sdl3-build/libSDL3.0.dylib" \
            "$FINAL_APP/Frameworks/"

          cp \
            "$BUILD/_deps/sdl3_image-build/libSDL3_image.0.dylib" \
            "$FINAL_APP/Frameworks/"

          echo "=== Adding OpenAL ==="

          OPENAL="$(find "$BUILD/_deps/openal_soft-build" \
            -type f \
            -name 'libopenal*.dylib' \
            | head -n 1)"

          if [ -z "$OPENAL" ]; then
            echo "ERROR: OpenAL dylib not found"
            exit 1
          fi

          cp "$OPENAL" \
            "$FINAL_APP/Frameworks/libopenal.1.dylib"

          echo "=== Adding optional GameSpy ==="

          if [ -f "$BUILD/libgamespy.dylib" ]; then
            cp "$BUILD/libgamespy.dylib" \
              "$FINAL_APP/Frameworks/"
          fi

          echo "=== Adding MoltenVK.framework ==="

          MVK="$HOME/GeneralsX/MoltenVK/MoltenVK/MoltenVK/dynamic/MoltenVK.xcframework/ios-arm64/MoltenVK.framework"

          if [ ! -d "$MVK" ]; then
            echo "ERROR: MoltenVK.framework not found"
            find "$HOME/GeneralsX" -name "MoltenVK.framework" -print || true
            exit 1
          fi

          cp -R "$MVK" \
            "$FINAL_APP/Frameworks/"

          echo "=== Adding rpath ==="

          install_name_tool \
            -add_rpath "@executable_path/Frameworks" \
            "$FINAL_APP/GeneralsXZH" \
            2>/dev/null || true

      - name: Add fonts and default configuration
        run: |
          FINAL_APP="$GITHUB_WORKSPACE/build/ios-package/GeneralsXZH.app"

          mkdir -p "$FINAL_APP/GameData/fonts"

          FONT_DIR="$HOME/GeneralsX/ios-staging/fonts"

          if [ -d "$FONT_DIR" ]; then
            cp "$FONT_DIR"/*.ttf \
              "$FINAL_APP/GameData/fonts/" || true
          fi

          cp ios/config/dxvk.conf \
            "$FINAL_APP/GameData/dxvk.conf"

          cp ios/config/Options.ini \
            "$FINAL_APP/GameData/DefaultOptions.ini"

      - name: Validate final iOS application
        run: |
          APP="$GITHUB_WORKSPACE/build/ios-package/GeneralsXZH.app"

          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist"

          echo "=== Bundle ID ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo "=== Executable ==="
          file "$APP/GeneralsXZH"

          echo "=== Frameworks ==="
          ls -lah "$APP/Frameworks"

          echo "=== Bundle ==="
          find "$APP" -maxdepth 2 -type f -print

      - name: Remove temporary code signatures
        run: |
          APP="$GITHUB_WORKSPACE/build/ios-package/GeneralsXZH.app"

          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          find "$APP/Frameworks" \
            -name "_CodeSignature" \
            -type d \
            -prune \
            -exec rm -rf {} + 2>/dev/null || true

      - name: Create sideload IPA
        run: |
          PACKAGE="$RUNNER_TEMP/GeneralsXZH-package"

          rm -rf "$PACKAGE"

          mkdir -p "$PACKAGE/Payload"

          cp -R \
            "$GITHUB_WORKSPACE/build/ios-package/GeneralsXZH.app" \
            "$PACKAGE/Payload/GeneralsXZH.app"

          cd "$PACKAGE"

          zip -qry \
            "$GITHUB_WORKSPACE/GeneralsXZH-Sideload.ipa" \
            Payload

          echo "=== IPA ==="

          ls -lh \
            "$GITHUB_WORKSPACE/GeneralsXZH-Sideload.ipa"

      - name: Verify IPA structure
        run: |
          unzip -l GeneralsXZH-Sideload.ipa | head -100

          unzip -p \
            GeneralsXZH-Sideload.ipa \
            Payload/GeneralsXZH.app/Info.plist \
            > /tmp/GeneralsInfo.plist

          plutil -p /tmp/GeneralsInfo.plist

          echo "=== Package type ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundlePackageType" \
            /tmp/GeneralsInfo.plist

          echo "=== Bundle ID ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            /tmp/GeneralsInfo.plist

      - name: Upload Sideload IPA
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-Sideload-IPA
          path: GeneralsXZH-Sideload.ipa
          retention-days: 7
          if-no-files-found: error
