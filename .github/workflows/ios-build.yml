name: Build iPhone Generals

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            meson \
            pkgconf \
            xcodegen \
            python3 \
            glslang \
            spirv-tools

          BREW_PREFIX="$(brew --prefix)"
          GLSLANG_PREFIX="$(brew --prefix glslang)"

          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$GLSLANG_PREFIX/bin" >> "$GITHUB_PATH"

          echo "=== Installed tools ==="
          cmake --version
          ninja --version
          meson --version

          echo "=== glslang ==="
          test -x "$GLSLANG_PREFIX/bin/glslangValidator"
          "$GLSLANG_PREFIX/bin/glslangValidator" --version

      - name: Configure shader tools PATH
        run: |
          GLSLANG_PREFIX="$(brew --prefix glslang)"
          BREW_PREFIX="$(brew --prefix)"

          echo "$GLSLANG_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"

          echo "GLSLANG_BIN=$GLSLANG_PREFIX/bin" >> "$GITHUB_ENV"

      - name: Verify glslang
        run: |
          export PATH="$GLSLANG_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"

          which glslangValidator
          glslangValidator --version

          which spirv-as || true
          which spirv-dis || true

      - name: Install vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          fi

          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Initialize DXVK submodule
        run: |
          git submodule update \
            --init \
            --recursive \
            references/fbraz3-dxvk

      - name: Build MoltenVK for iOS
        run: |
          cd "$RUNNER_TEMP"

          rm -rf MoltenVK

          git clone \
            --depth 1 \
            https://github.com/KhronosGroup/MoltenVK.git \
            MoltenVK

          cd MoltenVK

          ./fetchDependencies --ios

          make ios

          echo "=== MoltenVK libraries ==="
          find . -name "libMoltenVK.a" -print

      - name: Prepare Vulkan SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK"

          rm -rf "$SDK_ROOT"

          mkdir -p \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64"

          MOLTENVK_LIB="$(find "$RUNNER_TEMP/MoltenVK" \
            -type f \
            -name "libMoltenVK.a" \
            -path "*ios*" \
            | head -n 1)"

          if [ -z "$MOLTENVK_LIB" ]; then
            echo "ERROR: libMoltenVK.a not found"
            exit 1
          fi

          echo "Found MoltenVK:"
          echo "$MOLTENVK_LIB"

          cp "$MOLTENVK_LIB" \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"

          test -f \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          ls -lah \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/"

      - name: Fetch runtime MoltenVK
        run: |
          chmod +x ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: |
          chmod +x ./scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS build
        run: |
          export PATH="$GLSLANG_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "VULKAN_SDK=$VULKAN_SDK"
          echo "VCPKG_ROOT=$VCPKG_ROOT"

          which glslangValidator
          glslangValidator --version

          rm -rf build/ios-vulkan

          cmake --preset ios-vulkan

      - name: Build Generals Zero Hour
        run: |
          export PATH="$GLSLANG_BIN:/opt/homebrew/bin:/usr/local/bin:$PATH"

          which glslangValidator

          cmake --build build/ios-vulkan \
            --target z_generals \
            --parallel 3

      - name: Verify generated application
        run: |
          APP_PATH="build/ios-vulkan/GeneralsMD/GeneralsXZH.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: GeneralsXZH.app not found"
            find build -type d -name "*.app" -print || true
            exit 1
          fi

          echo "=== GeneralsXZH.app found ==="
          du -sh "$APP_PATH"

          echo "=== App contents ==="
          ls -lah "$APP_PATH"

      - name: Create unsigned IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/ios-vulkan/GeneralsMD/GeneralsXZH.app"
          IPA_DIR="$RUNNER_TEMP/ipa"

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          cp -R "$APP_PATH" \
            "$IPA_DIR/Payload/GeneralsXZH.app"

          cd "$IPA_DIR"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$GITHUB_WORKSPACE/GeneralsXZH-unsigned.ipa"

          echo "=== IPA created ==="
          ls -lh "$GITHUB_WORKSPACE/GeneralsXZH-unsigned.ipa"

      - name: Verify IPA
        run: |
          echo "=== IPA contents ==="

          unzip -l GeneralsXZH-unsigned.ipa | head -100

          if unzip -l GeneralsXZH-unsigned.ipa \
            | grep -q "Payload/GeneralsXZH.app/"; then

            echo "IPA structure OK"
          else
            echo "ERROR: Invalid IPA structure"
            exit 1
          fi

      - name: Upload iOS app
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-app
          path: build/ios-vulkan/GeneralsMD/GeneralsXZH.app
          retention-days: 7
          if-no-files-found: error

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-unsigned-IPA
          path: GeneralsXZH-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
