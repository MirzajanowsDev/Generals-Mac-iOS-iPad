name: Build Generals iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Initialize DXVK submodule
        run: |
          git submodule update --init references/fbraz3-dxvk

      # Static MoltenVK for compiling/linking
      - name: Download Vulkan SDK
        run: |
          mkdir -p "$HOME/VulkanSDK"

          curl -L \
            -o /tmp/vulkansdk.zip \
            https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip

          unzip -q /tmp/vulkansdk.zip -d "$HOME/VulkanSDK"

          echo "=== Vulkan SDK contents ==="
          find "$HOME/VulkanSDK" -name "libMoltenVK.a" -print

      - name: Detect Vulkan SDK
        run: |
          MOLTENVK_LIB=$(find "$HOME/VulkanSDK" \
            -path "*/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" \
            | head -n 1)

          if [ -z "$MOLTENVK_LIB" ]; then
            echo "ERROR: Static libMoltenVK.a not found"
            find "$HOME/VulkanSDK" -iname "*MoltenVK*" -print
            exit 1
          fi

          echo "Found:"
          echo "$MOLTENVK_LIB"

          SDK_ROOT="${MOLTENVK_LIB%/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a}"

          echo "VULKAN_SDK=$SDK_ROOT"
          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"

          test -f \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          ls -lah \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/"

      # Dynamic MoltenVK.framework for the final iPhone app
      - name: Fetch runtime MoltenVK
        run: |
          chmod +x ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: |
          chmod +x ./scripts/build/ios/stage-fonts.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS build
        run: |
          echo "Using VULKAN_SDK=$VULKAN_SDK"
          cmake --preset ios-vulkan

      - name: Build Generals
        run: |
          cmake --build build/ios-vulkan \
            --target z_generals \
            --parallel 3

      - name: Find generated app
        if: always()
        run: |
          echo "=== Generated apps ==="
          find build -name "*.app" -print || true

          echo "=== Generals binaries ==="
          find build -name "GeneralsXZH" -print || true

      - name: Upload compiled files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generals-ios-build
          path: build/ios-vulkan
        uses: actions/upload-artifact@v4
        with:
          name: generals-ios-build
          path: build/ios-vulkan
