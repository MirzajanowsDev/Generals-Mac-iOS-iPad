name: Build Generals iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update

          brew install \
            cmake \
            ninja \
            meson \
            pkgconf \
            xcodegen \
            python3 \
            glslang \
            spirv-tools

          BREW_PREFIX="$(brew --prefix)"

          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"

          echo "=== Homebrew prefix ==="
          echo "$BREW_PREFIX"

          echo "=== Installed tools ==="
          cmake --version
          ninja --version
          meson --version

      - name: Setup glslang
        run: |
          BREW_PREFIX="$(brew --prefix)"

          GLSLANG_VALIDATOR="$(find "$BREW_PREFIX" \
            -type f \
            -name "glslangValidator" \
            2>/dev/null \
            | head -n 1)"

          if [ -z "$GLSLANG_VALIDATOR" ]; then
            echo "ERROR: glslangValidator not found"

            echo "=== brew info glslang ==="
            brew info glslang || true

            echo "=== brew list glslang ==="
            brew list glslang || true

            echo "=== searching Homebrew ==="
            find "$BREW_PREFIX" -iname "*glslang*" -print || true

            exit 1
          fi

          echo "Found glslangValidator:"
          echo "$GLSLANG_VALIDATOR"

          GLSLANG_DIR="$(dirname "$GLSLANG_VALIDATOR")"

          echo "$GLSLANG_DIR" >> "$GITHUB_PATH"

          "$GLSLANG_VALIDATOR" --version

      - name: Install vcpkg
        run: |
          if [ ! -d "$HOME/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          fi

          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

          echo "VCPKG_ROOT=$HOME/vcpkg"

      - name: Initialize DXVK submodule
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk

      - name: Build MoltenVK for iOS
        run: |
          cd "$RUNNER_TEMP"

          if [ ! -d "MoltenVK" ]; then
            git clone --depth 1 \
              https://github.com/KhronosGroup/MoltenVK.git \
              MoltenVK
          fi

          cd MoltenVK

          ./fetchDependencies --ios

          make ios

          echo "=== MoltenVK libraries ==="
          find . -name "libMoltenVK.a" -print

      - name: Prepare Vulkan SDK
        run: |
          SDK_ROOT="$RUNNER_TEMP/VulkanSDK"

          mkdir -p \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64"

          MOLTENVK_LIB="$(find "$RUNNER_TEMP/MoltenVK" \
            -type f \
            -name "libMoltenVK.a" \
            -path "*ios*" \
            | head -n 1)"

          if [ -z "$MOLTENVK_LIB" ]; then
            echo "ERROR: libMoltenVK.a not found"

            find "$RUNNER_TEMP/MoltenVK" \
              -iname "*MoltenVK*" \
              -print || true

            exit 1
          fi

          echo "Found MoltenVK:"
          echo "$MOLTENVK_LIB"

          cp "$MOLTENVK_LIB" \
            "$SDK_ROOT/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Prepared Vulkan SDK:"
          find "$SDK_ROOT" -type f -print

      - name: Verify Vulkan SDK
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"

          test -f \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

          ls -lah \
            "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/"

      - name: Verify shader tools
        run: |
          echo "PATH=$PATH"

          echo "=== glslangValidator ==="
          which glslangValidator
          glslangValidator --version

          echo "=== glslang ==="
          which glslang || true

          echo "=== spirv tools ==="
          which spirv-as || true
          which spirv-dis || true

      - name: Fetch runtime MoltenVK
        run: |
          chmod +x ./scripts/build/ios/fetch-moltenvk.sh

          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: |
          chmod +x ./scripts/build/ios/stage-fonts.sh

          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS build
        env:
          PATH: /opt/homebrew/bin:/usr/local/bin:${{ env.PATH }}
        run: |
          echo "=== Configuration environment ==="

          echo "VULKAN_SDK=$VULKAN_SDK"
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "PATH=$PATH"

          which glslangValidator
          glslangValidator --version

          cmake --preset ios-vulkan

      - name: Build Generals Zero Hour
        env:
          PATH: /opt/homebrew/bin:/usr/local/bin:${{ env.PATH }}
        run: |
          echo "=== Build environment ==="

          which glslangValidator
          glslangValidator --version

          cmake --build build/ios-vulkan \
            --target z_generals \
            --parallel 3

      - name: Find generated application
        if: always()
        run: |
          echo "=== iOS app bundles ==="

          find build \
            -type d \
            -name "*.app" \
            -print || true

          echo "=== GeneralsXZH binaries ==="

          find build \
            -type f \
            -name "GeneralsXZH" \
            -print || true

          echo "=== GeneralsMD directory ==="

          ls -lah \
            build/ios-vulkan/GeneralsMD/ \
            || true

      - name: Upload iOS app
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: GeneralsXZH-iOS
          path: build/ios-vulkan/GeneralsMD/GeneralsXZH.app
          retention-days: 7
          if-no-files-found: error
